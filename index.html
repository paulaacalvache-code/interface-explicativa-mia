<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interface Explicativa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <style>
        .caja1 {
            background-color: #8B57CA;
            height: 150px;
        }
        .caja2 {
            background-color: #7A8BE1;
            height: 900px;
        }
        .caja3 { 
            background-color: #FC8EBE;
            height: 900px;
        }
        .caja4 {
            background-color: #7c0080;
            height: 200px;
        }
    </style>
  </head>
  <body>
    <h1 class="text-center">Mi Página Web</h1>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12 caja1">
                <!-- As a link -->
                    <nav class="navbar bg-body-tertiary">
                      <div class="container-fluid">
                        <a class="navbar-brand" href="#">Paula Bustos</a>
                  </div>
                </nav>                
            </div>
        </div>
        <div class="row">
            <div class="col-3 col-sm-3 col-md-3 col-lg-3 col-xl-3 col-xxl-3 caja2">
                <div class="btn-group-vertical" role="group" aria-label="Vertical radio toggle button group">
                      <input type="radio" class="btn-check" name="vbtn-radio" id="vbtn-radio1" autocomplete="off" checked>
                      <label class="btn btn-outline-danger" for="vbtn-radio1">Radio 1</label>
                      <input type="radio" class="btn-check" name="vbtn-radio" id="vbtn-radio2" autocomplete="off">
                      <label class="btn btn-outline-danger" for="vbtn-radio2">Radio 2</label>
                      <input type="radio" class="btn-check" name="vbtn-radio" id="vbtn-radio3" autocomplete="off">
                      <label class="btn btn-outline-danger" for="vbtn-radio3">Radio 3</label>
                </div>
            </div>
            <div class="col-9 col-sm-9 col-md-9 col-lg-9 col-xl-9 col-xxl-9 caja3">Viewport</div>
        </div>
        <div class="row">
            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12 caja4">
                Soy Footer
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
